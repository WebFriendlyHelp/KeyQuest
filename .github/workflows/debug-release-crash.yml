name: Debug release crash (temporary)

# Reproduce and bisect the 0xC0000005 startup crash that stopped release.yml
# twice on v1.28.1. Release-like steps only up to the tests: NO signing, NO
# publishing, no secrets. Debug branch only; delete with the branch.
# Rounds 1 to 9: see crash-status.md. Crash inside pygame.event.get (pygame's
# event module building a dict); only after "pip install ruff" in the job;
# 1.28.1 code crashes, 1.28.0 code never did (0 of 352); not the folder, not
# the running mutex, not the handler timeout alone.
# Round 10 (43352657915): 1.28.0 plus any one 1.28.1 file 0/96 each; full
#   1.28.1 5/96.
# Round 11: combinations. 1.28.0 plus dev_server and single_instance together;
#   1.28.1 with 1.28.0's dev_server; 1.28.1 with 1.28.0's single_instance;
#   1.28.1 with all of 1.28.0's app code (only non-code files new).

on:
  push:
    branches:
      - debug/release-crash-2026-11-12
  workflow_dispatch:

permissions:
  contents: read

jobs:
  files:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        rep: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Sibling folders, 1.28.0 with one 1.28.1 file each
        shell: pwsh
        run: |
          # Old-based: 1.28.0 with these 1.28.1 files.
          $oldBased = [ordered]@{
            old = @()
            old_plus_both = @('modules/dev_server.py', 'modules/single_instance.py')
          }
          foreach ($name in $oldBased.Keys) {
            git worktree add "..\kq_$name" c1ab16b | Out-Null
            git show HEAD:tests/test_launch_smoke.py | Set-Content "..\kq_$name\tests\test_launch_smoke.py" -Encoding utf8
            foreach ($f in $oldBased[$name]) { git show "HEAD:$f" | Set-Content "..\kq_$name\$f" -Encoding utf8 }
          }
          # New-based: 1.28.1 with these files put back to 1.28.0.
          $newBased = [ordered]@{
            new = @()
            new_old_dev_server = @('modules/dev_server.py')
            new_old_single_instance = @('modules/single_instance.py')
          }
          foreach ($name in $newBased.Keys) {
            git worktree add "..\kq_$name" HEAD | Out-Null
            foreach ($f in $newBased[$name]) { git show "c1ab16b:$f" | Set-Content "..\kq_$name\$f" -Encoding utf8 }
          }
          git worktree add ..\kq_new_old_code HEAD | Out-Null
          Push-Location ..\kq_new_old_code; git checkout c1ab16b -- modules games ui keyquest.pyw; Pop-Location
          Get-ChildItem .. -Directory | ForEach-Object { $_.Name }

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python dependencies (as release.yml)
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller pytest

      - name: pip install ruff and ruff check (as release.yml)
        shell: pwsh
        run: |
          python -m pip install ruff
          ruff check .

      - name: Interleaved launches
        shell: pwsh
        run: |
          $names = 'old', 'old_plus_both', 'new', 'new_old_dev_server', 'new_old_single_instance', 'new_old_code'
          $tally = @{}; foreach ($n in $names) { $tally[$n] = 0 }
          $rounds = 12
          for ($i = 1; $i -le $rounds; $i++) {
            foreach ($n in $names) {
              Push-Location "..\kq_$n"
              $out = python -m pytest -q -rf tests/test_launch_smoke.py 2>&1 | Out-String
              $code = $LASTEXITCODE
              Pop-Location
              if ($code -ne 0) { $tally[$n]++; if ($out -notmatch '3221225477') { Write-Host "=== $n run $i failed differently ==="; Write-Host $out } }
            }
          }
          Write-Host ("FILES: " + (($names | ForEach-Object { "$_ $($tally[$_])/$rounds" }) -join ', '))
