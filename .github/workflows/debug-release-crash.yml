name: Debug release crash (temporary)

# Reproduce and bisect the 0xC0000005 startup crash that stopped release.yml
# twice on v1.28.1. Release-like steps only up to the tests: NO signing, NO
# publishing, no secrets. Debug branch only; delete with the branch.
# Rounds 1 to 13: see crash-status.md. Cause: _maximize_window dropped the
# pygame._sdl2 Window whose address pygame keeps in the SDL window data, so
# pygame.event.get increments freed memory on every window event.
# Round 14: verify the fix (Window kept on the app). Page heap, fixed against
# unfixed; and the release-like condition, fixed against unfixed, paired.

on:
  push:
    branches:
      - debug/release-crash-2026-11-12
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pageheap:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        code: [fixed, unfixed]
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Unfixed app code (unfixed only)
        if: matrix.code == 'unfixed'
        shell: pwsh
        run: git checkout HEAD~1 -- modules/keyquest_app.py

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python dependencies (as release.yml)
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller pytest

      - name: Page heap on for python.exe
        shell: pwsh
        run: |
          $ifeo = "HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Image File Execution Options\python.exe"
          New-Item -Path $ifeo -Force | Out-Null
          New-ItemProperty -Path $ifeo -Name GlobalFlag -Value 0x02000000 -PropertyType DWord -Force | Out-Null
          New-ItemProperty -Path $ifeo -Name PageHeapFlags -Value 0x3 -PropertyType DWord -Force | Out-Null

      - name: Launch under page heap, 6 times
        shell: pwsh
        run: |
          $env:PYTHONMALLOC = 'malloc'
          $fails = 0
          for ($i = 1; $i -le 6; $i++) {
            $out = python -m pytest -q -rf tests/test_launch_smoke.py 2>&1 | Out-String
            if ($LASTEXITCODE -ne 0) { $fails++; if ($fails -eq 1) { Write-Host $out } }
          }
          Write-Host "PAGEHEAP FAILURES: $fails of 6 (${{ matrix.code }})"

      - name: Page heap off
        if: always()
        shell: pwsh
        run: Remove-Item "HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Image File Execution Options\python.exe" -Recurse -Force -ErrorAction SilentlyContinue

  paired:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        rep: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Unfixed copy beside it
        shell: pwsh
        run: |
          git worktree add ..\kq_unfixed HEAD | Out-Null
          Push-Location ..\kq_unfixed; git checkout HEAD~1 -- modules/keyquest_app.py; Pop-Location

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python dependencies (as release.yml)
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller pytest

      - name: Lint (as release.yml)
        shell: pwsh
        run: |
          python -m pip install ruff
          ruff check .

      - name: Full suite once (as release.yml), fixed code
        shell: pwsh
        run: python -m pytest -q -rf

      - name: Interleaved launches, fixed and unfixed
        shell: pwsh
        run: |
          $tally = @{ fixed = 0; unfixed = 0 }
          $rounds = 16
          for ($i = 1; $i -le $rounds; $i++) {
            foreach ($v in 'fixed', 'unfixed') {
              $dir = if ($v -eq 'unfixed') { '..\kq_unfixed' } else { '.' }
              Push-Location $dir
              $out = python -m pytest -q -rf tests/test_launch_smoke.py 2>&1 | Out-String
              $code = $LASTEXITCODE
              Pop-Location
              if ($code -ne 0) { $tally[$v]++; if ($v -eq 'fixed') { Write-Host "=== fixed run $i FAILED ==="; Write-Host $out } }
            }
          }
          Write-Host ("VERIFY: fixed {0}/{2}, unfixed {1}/{2}" -f $tally.fixed, $tally.unfixed, $rounds)
          if ($tally.fixed) { exit 1 }
