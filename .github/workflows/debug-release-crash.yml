name: Debug release crash (temporary)

# Reproduce and bisect the 0xC0000005 startup crash that stopped release.yml
# twice on v1.28.1. Release-like steps only up to the tests: NO signing, NO
# publishing, no secrets. Debug branch only; delete with the branch.
# Round 1 (43347491889): crash in pygame.event.get, 20 of 40 release-like.
# Rounds 2 to 5: the rate varies by job from 0 to 21 of 30; a native dump
# (round 5, 43349464280) shows the access violation inside pygame's
# event.cp311 module while it builds an event's dict (PyDict_SetItem).
# Round 6: KQ_DEBUG_EVENT_TYPES prints each raw SDL event type before
# pygame converts it, so the crashing event is named.

on:
  push:
    branches:
      - debug/release-crash-2026-11-12
  workflow_dispatch:

permissions:
  contents: read

jobs:
  events:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        rep: [1, 2, 3, 4, 5, 6]
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python dependencies (as release.yml)
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller pytest
          python -m pip install ruff
          ruff check .

      - name: Machine
        shell: pwsh
        run: |
          Get-CimInstance Win32_Processor | ForEach-Object { $_.Name }
          Get-PnpDevice -PresentOnly -Class HIDClass,Keyboard,Mouse -ErrorAction SilentlyContinue | ForEach-Object { "{0} | {1}" -f $_.Class, $_.FriendlyName }

      - name: Launch smoke test 20 times, raw event types logged
        shell: pwsh
        run: |
          $env:KQ_DEBUG_EVENT_TYPES = '1'
          $fails = 0; $shown = 0
          for ($i = 1; $i -le 20; $i++) {
            $out = python -m pytest -q -rf tests/test_launch_smoke.py 2>&1 | Out-String
            if ($LASTEXITCODE -ne 0) {
              $fails++
              if ($shown -lt 3) { $shown++; Write-Host "=== run $i FAILED ==="; Write-Host $out }
            }
          }
          Write-Host "SMOKE FAILURES: $fails of 20"
          # One passing run's event list for comparison.
          $env:KQ_DEBUG_FORCE_FAIL = ''
          python -c "import os,subprocess,sys,tempfile,time; e=dict(os.environ,KEYQUEST_NO_SPEECH='1',SDL_VIDEODRIVER='dummy',SDL_AUDIODRIVER='dummy',KEYQUEST_PROGRESS_PATH=os.path.join(tempfile.mkdtemp(),'p.json'));p=subprocess.Popen([sys.executable,'keyquest.pyw'],env=e,stdout=subprocess.DEVNULL,stderr=subprocess.PIPE,stdin=subprocess.DEVNULL);time.sleep(5);p.kill();print('EVENTS OF ONE RUN (exit',p.poll(),'):');print(p.communicate()[1].decode('utf-8','replace')[-3000:])"
