name: Debug release crash (temporary)

# Reproduce and bisect the 0xC0000005 startup crash that stopped release.yml
# twice on v1.28.1. Release-like steps only up to the tests: NO signing, NO
# publishing, no secrets. Debug branch only; delete with the branch.
# Rounds 1 to 6 (see crash-status.md): crash inside pygame.event.get while
# converting one of the first two events (AUDIODEVICEADDED, WINDOWSHOWN);
# jobs that ran "pip install ruff" first crashed in 11 of 15, jobs that did
# not in 0 of 10.
# Round 7 (43350738831), paired per machine: before pip install ruff 0/288;
#   after it 1.28.1 5/96, 1.28.0 0/96, 1.28.1 without the running mutex 8/96.
# Round 8 (43351509061), after pip install ruff: 1.28.1 7/128, 1.28.0 0/128,
#   1.28.1 with the handler timeout off 11/128.
# Round 9: is it the code or the folder? 1.28.1 in the main checkout, 1.28.1
#   in a fresh sibling worktree, 1.28.0 in a fresh sibling worktree.

on:
  push:
    branches:
      - debug/release-crash-2026-11-12
  workflow_dispatch:

permissions:
  contents: read

jobs:
  paired:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        rep: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: 1.28.0 app code beside it
        shell: pwsh
        run: |
          git worktree add ..\kq128 c1ab16b
          Copy-Item tests\test_launch_smoke.py ..\kq128\tests\test_launch_smoke.py -Force
          git worktree add ..\kqnew HEAD

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python dependencies (as release.yml)
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller pytest

      - name: Machine
        shell: pwsh
        run: Get-CimInstance Win32_Processor | ForEach-Object { $_.Name }

      - name: Write the paired loop
        shell: pwsh
        run: |
          @'
          param([string]$Phase, [int]$Rounds)
          $here = (Get-Location).Path
          $old = (Resolve-Path ..\kq128).Path
          $newThere = (Resolve-Path ..\kqnew).Path
          $tally = @{ new = 0; old = 0; newthere = 0 }
          for ($i = 1; $i -le $Rounds; $i++) {
            foreach ($v in 'new', 'old', 'newthere') {
              $dir = if ($v -eq 'old') { $old } elseif ($v -eq 'newthere') { $newThere } else { $here }
              Push-Location $dir
              $out = python -m pytest -q -rf tests/test_launch_smoke.py 2>&1 | Out-String
              $code = $LASTEXITCODE
              Pop-Location
              if ($code -ne 0) { $tally[$v]++; if ($out -notmatch '3221225477') { Write-Host "=== $v run $i failed differently ==="; Write-Host $out } }
            }
          }
          Write-Host ("PAIRED {0}: 1.28.1 main checkout {1}/{4}, 1.28.0 sibling {2}/{4}, 1.28.1 sibling {3}/{4}" -f $Phase, $tally.new, $tally.old, $tally.newthere, $Rounds)
          '@ | Set-Content $env:RUNNER_TEMP\paired.ps1

      - name: pip install ruff and ruff check (as release.yml)
        shell: pwsh
        run: |
          python -m pip install ruff
          ruff check .

      - name: Phase B, after pip install ruff
        shell: pwsh
        run: '& $env:RUNNER_TEMP\paired.ps1 -Phase "after ruff" -Rounds 16'
