name: Debug release crash (temporary)

# Reproduce and bisect the 0xC0000005 startup crash that stopped release.yml
# twice on v1.28.1. Release-like steps only up to the tests: NO signing, NO
# publishing, no secrets. Debug branch only; delete with the branch.
# Round 1 (43347491889), lint + env snapshot + suite + loop: crash in
#   pygame.event.get (keyquest_app.py line 1433); release-like 20 of 40.
# Round 2 (43348022751), no lint, no suite: 0 of 120.
# Round 3 (43348452499), suite, no lint: 0 of 120.
# Round 4 (43348987710): lint+suite 21/30, lint only 18/30, lint then delete
#   .ruff_cache 10/30, no lint 0/30. The Lint step triggers it.
# Round 5: native crash dumps (WER LocalDumps) read with cdb, after Lint.

on:
  push:
    branches:
      - debug/release-crash-2026-11-12
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dump:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        variant: [lint-only, ruff-check-only, pip-ruff-only]
    env:
      KQ_VARIANT: ${{ matrix.variant }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python dependencies (as release.yml)
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller pytest

      - name: Crash dumps on
        shell: pwsh
        run: |
          $k = "HKLM:\SOFTWARE\Microsoft\Windows\Windows Error Reporting\LocalDumps\python.exe"
          New-Item -Path $k -Force | Out-Null
          New-ItemProperty -Path $k -Name DumpFolder -Value "$env:RUNNER_TEMP\dumps" -PropertyType ExpandString -Force | Out-Null
          New-ItemProperty -Path $k -Name DumpType -Value 1 -PropertyType DWord -Force | Out-Null
          New-ItemProperty -Path $k -Name DumpCount -Value 10 -PropertyType DWord -Force | Out-Null
          New-Item -ItemType Directory -Force "$env:RUNNER_TEMP\dumps" | Out-Null
          Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\Debuggers\x64\cdb.exe" -ErrorAction SilentlyContinue | ForEach-Object { "cdb: " + $_.FullName }

      - name: pip install ruff
        if: matrix.variant != 'ruff-check-only'
        shell: pwsh
        run: python -m pip install ruff

      - name: ruff check (standalone ruff.exe for ruff-check-only)
        if: matrix.variant != 'pip-ruff-only'
        shell: pwsh
        run: |
          if ($env:KQ_VARIANT -eq 'ruff-check-only') {
            python -m pip download ruff==0.17.5 --no-deps -d $env:RUNNER_TEMP\ruffwhl -q
            Expand-Archive (Get-ChildItem $env:RUNNER_TEMP\ruffwhl\*.whl).FullName -DestinationPath $env:RUNNER_TEMP\ruffx -Force
            $ruff = (Get-ChildItem $env:RUNNER_TEMP\ruffx -Recurse -Filter ruff.exe | Select-Object -First 1).FullName
            & $ruff check .
          } else { ruff check . }

      - name: Launch smoke test 20 times
        continue-on-error: true
        shell: pwsh
        run: |
          $fails = 0
          for ($i = 1; $i -le 20; $i++) {
            $out = python -m pytest -q -rf tests/test_launch_smoke.py 2>&1 | Out-String
            if ($LASTEXITCODE -ne 0) { $fails++ }
          }
          Write-Host "SMOKE FAILURES: $fails of 20 ($env:KQ_VARIANT)"

      - name: Read the first dump with cdb
        shell: pwsh
        run: |
          $dumps = Get-ChildItem "$env:RUNNER_TEMP\dumps" -Filter *.dmp -ErrorAction SilentlyContinue
          "dumps: $($dumps.Count)"
          if (-not $dumps) { exit 0 }
          $cdb = "C:\Program Files (x86)\Windows Kits\10\Debuggers\x64\cdb.exe"
          if (-not (Test-Path $cdb)) { "no cdb on this image"; exit 0 }
          $env:_NT_SYMBOL_PATH = "srv*$env:RUNNER_TEMP\sym*https://msdl.microsoft.com/download/symbols"
          & $cdb -z $dumps[0].FullName -c ".ecxr; kn 40; lm; q" 2>&1 | Select-Object -Last 220
