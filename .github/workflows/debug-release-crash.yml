name: Debug release crash (temporary)

# Reproduce and bisect the 0xC0000005 startup crash that stopped release.yml
# twice on v1.28.1. Release-like steps only up to the tests: NO signing, NO
# publishing, no secrets. Debug branch only; delete with the branch.
# Round 1 (43347491889), lint + env snapshot + suite + loop: crash in
#   pygame.event.get (keyquest_app.py line 1433); release-like 20 of 40.
# Round 2 (43348022751), no lint, no suite: 0 of 120.
# Round 3 (43348452499), suite, no lint: 0 of 120.
# Round 4: is it the Lint step (ruff, .ruff_cache) or the runner machine?

on:
  push:
    branches:
      - debug/release-crash-2026-11-12
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bisect:
    runs-on: windows-latest
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        variant: [lint-suite, lint-only, lint-then-delete-cache, no-lint]
    env:
      KQ_VARIANT: ${{ matrix.variant }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python dependencies (as release.yml)
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller pytest

      - name: Machine
        shell: pwsh
        run: |
          Get-CimInstance Win32_Processor | ForEach-Object { "{0}, {1} cores, {2} logical" -f $_.Name, $_.NumberOfCores, $_.NumberOfLogicalProcessors }
          "{0:N1} GB RAM" -f ((Get-CimInstance Win32_ComputerSystem).TotalPhysicalMemory / 1GB)
          "computer $env:COMPUTERNAME"

      - name: Lint (as release.yml)
        if: startsWith(matrix.variant, 'lint')
        shell: pwsh
        run: |
          python -m pip install ruff
          ruff check .
          Get-ChildItem -Force .ruff_cache -Recurse | Select-Object -First 10 | ForEach-Object { $_.FullName }

      - name: Delete .ruff_cache
        if: matrix.variant == 'lint-then-delete-cache'
        shell: pwsh
        run: Remove-Item -Recurse -Force .ruff_cache

      - name: Full suite once (lint-suite only)
        if: matrix.variant == 'lint-suite'
        continue-on-error: true
        shell: pwsh
        run: python -m pytest -q -rf

      - name: Launch smoke test 30 times
        shell: pwsh
        run: |
          $fails = 0
          for ($i = 1; $i -le 30; $i++) {
            $out = python -m pytest -q -rf tests/test_launch_smoke.py 2>&1 | Out-String
            if ($LASTEXITCODE -ne 0) { $fails++; if ($fails -le 2) { Write-Host "=== run $i FAILED ==="; Write-Host $out } }
          }
          Write-Host "SMOKE FAILURES: $fails of 30 ($env:KQ_VARIANT)"
          if ($fails) { exit 1 }
