name: Debug release crash (temporary)

# Reproduce and bisect the 0xC0000005 startup crash that stopped release.yml
# twice on v1.28.1. Release-like steps only up to the tests: NO signing, NO
# publishing, no secrets. Debug branch only; delete with the branch.
# Rounds 1 to 6 (see crash-status.md): crash inside pygame.event.get while
# converting one of the first two events (AUDIODEVICEADDED, WINDOWSHOWN);
# jobs that ran "pip install ruff" first crashed in 11 of 15, jobs that did
# not in 0 of 10.
# Round 7, paired on one machine per job: before and after pip install ruff,
# and in each phase 1.28.1 code, 1.28.0 code and 1.28.1 with the running
# mutex off, interleaved launch by launch.

on:
  push:
    branches:
      - debug/release-crash-2026-11-12
  workflow_dispatch:

permissions:
  contents: read

jobs:
  paired:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        rep: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: 1.28.0 app code beside it
        shell: pwsh
        run: |
          git worktree add ..\kq128 c1ab16b
          Copy-Item tests\test_launch_smoke.py ..\kq128\tests\test_launch_smoke.py -Force

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python dependencies (as release.yml)
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller pytest

      - name: Machine
        shell: pwsh
        run: Get-CimInstance Win32_Processor | ForEach-Object { $_.Name }

      - name: Write the paired loop
        shell: pwsh
        run: |
          @'
          param([string]$Phase, [int]$Rounds)
          $here = (Get-Location).Path
          $old = (Resolve-Path ..\kq128).Path
          $tally = @{ new = 0; old = 0; nomutex = 0 }
          for ($i = 1; $i -le $Rounds; $i++) {
            foreach ($v in 'new', 'old', 'nomutex') {
              $dir = if ($v -eq 'old') { $old } else { $here }
              if ($v -eq 'nomutex') { $env:KQ_DEBUG_NO_RUNNING_MUTEX = '1' } else { Remove-Item Env:KQ_DEBUG_NO_RUNNING_MUTEX -ErrorAction SilentlyContinue }
              Push-Location $dir
              $out = python -m pytest -q -rf tests/test_launch_smoke.py 2>&1 | Out-String
              $code = $LASTEXITCODE
              Pop-Location
              if ($code -ne 0) { $tally[$v]++; if ($out -notmatch '3221225477') { Write-Host "=== $v run $i failed differently ==="; Write-Host $out } }
            }
          }
          Write-Host ("PAIRED {0}: new {1}/{4}, old {2}/{4}, nomutex {3}/{4}" -f $Phase, $tally.new, $tally.old, $tally.nomutex, $Rounds)
          '@ | Set-Content $env:RUNNER_TEMP\paired.ps1

      - name: Phase A, before pip install ruff
        shell: pwsh
        run: '& $env:RUNNER_TEMP\paired.ps1 -Phase "A before ruff" -Rounds 12'

      - name: pip install ruff and ruff check (as release.yml)
        shell: pwsh
        run: |
          python -m pip install ruff
          ruff check .

      - name: Phase B, after pip install ruff
        shell: pwsh
        run: '& $env:RUNNER_TEMP\paired.ps1 -Phase "B after ruff" -Rounds 12'
