name: Debug release crash (temporary)

# Reproduce the 0xC0000005 startup crash that stopped release.yml twice on
# v1.28.1 (runs 43309104393 attempts 1 and 2) while ci.yml passed. Copies
# release.yml's steps up to and including the tests, with NO signing, NO
# publishing and no secrets, next to a ci.yml-like job, then runs the launch
# smoke test many times. Debug branch only; delete with the branch.

on:
  push:
    branches:
      - debug/release-crash-2026-11-12
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repro:
    runs-on: windows-latest
    # release.yml's job has id-token: write, which adds the
    # ACTIONS_ID_TOKEN_REQUEST_* variables to every step's environment.
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        flavor: [release, ci]
        rep: [1, 2]
    env:
      KQ_FLAVOR: ${{ matrix.flavor }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python dependencies (release flavor)
        if: matrix.flavor == 'release'
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller pytest

      - name: Install dependencies (ci flavor)
        if: matrix.flavor == 'ci'
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt ruff pytest

      - name: Install Inno Setup (release flavor)
        if: matrix.flavor == 'release'
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Artifact Signing helper, download only (release flavor)
        # release.yml's azure/login cannot run here (it needs the release
        # environment); the helper download and --can-sign do not need it.
        if: matrix.flavor == 'release'
        shell: pwsh
        run: |
          $v = "1.0.146"
          $root = "$env:LOCALAPPDATA\ArtifactSigning\$v"
          New-Item -ItemType Directory -Force $root | Out-Null
          Invoke-WebRequest "https://api.nuget.org/v3-flatcontainer/microsoft.artifactsigning.client/$v/microsoft.artifactsigning.client.$v.nupkg" -OutFile "$root\pkg.zip"
          Expand-Archive "$root\pkg.zip" -DestinationPath $root -Force
          python tools/build/codesign.py --can-sign
          exit 0

      - name: Lint
        shell: pwsh
        run: |
          python -m pip install ruff
          ruff check .

      - name: Environment snapshot
        shell: pwsh
        run: |
          python -c "import sys, platform; print(sys.version); print(platform.platform())"
          python -m pip list --format=freeze
          Get-ChildItem env: | Sort-Object Name | ForEach-Object { "{0}={1}" -f $_.Name, $_.Value }

      - name: Full suite once, as release.yml runs it
        id: suite
        continue-on-error: true
        shell: pwsh
        run: python -m pytest -q -rf

      - name: Launch smoke test 20 times
        shell: pwsh
        run: |
          $fails = 0
          for ($i = 1; $i -le 20; $i++) {
            $out = python -m pytest -q -rf tests/test_launch_smoke.py 2>&1 | Out-String
            if ($LASTEXITCODE -ne 0) { $fails++; Write-Host "=== run $i FAILED ==="; Write-Host $out }
          }
          Write-Host "SMOKE FAILURES: $fails of 20 ($env:KQ_FLAVOR)"
          if ($fails -or '${{ steps.suite.outcome }}' -ne 'success') { exit 1 }
