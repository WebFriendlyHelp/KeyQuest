name: Debug release crash (temporary)

# Reproduce and bisect the 0xC0000005 startup crash that stopped release.yml
# twice on v1.28.1. Release-like steps only up to the tests: NO signing, NO
# publishing, no secrets. Debug branch only; delete with the branch.
# Round 1 (run 43347491889): crash in pygame.event.get (keyquest_app.py line
# 1433), release-like 20 of 40 smoke runs, ci-like 0 of 40 (+1 in a suite).

on:
  push:
    branches:
      - debug/release-crash-2026-11-12
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bisect:
    runs-on: windows-latest
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        variant: [base, nomutex, notimeout, v1280code]
    env:
      KQ_VARIANT: ${{ matrix.variant }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Use 1.28.0's app code with the evidence-keeping test (v1280code only)
        if: matrix.variant == 'v1280code'
        shell: pwsh
        run: |
          git show HEAD:tests/test_launch_smoke.py > $env:RUNNER_TEMP\smoke.py
          git checkout c1ab16b -- modules games ui keyquest.pyw
          Copy-Item $env:RUNNER_TEMP\smoke.py tests\test_launch_smoke.py -Force
          git status --short | Select-Object -First 20

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python dependencies (as release.yml)
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller pytest

      - name: Install Inno Setup (as release.yml)
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Artifact Signing helper, download only (as release.yml, no azure/login)
        shell: pwsh
        run: |
          $v = "1.0.146"
          $root = "$env:LOCALAPPDATA\ArtifactSigning\$v"
          New-Item -ItemType Directory -Force $root | Out-Null
          Invoke-WebRequest "https://api.nuget.org/v3-flatcontainer/microsoft.artifactsigning.client/$v/microsoft.artifactsigning.client.$v.nupkg" -OutFile "$root\pkg.zip"
          Expand-Archive "$root\pkg.zip" -DestinationPath $root -Force
          python tools/build/codesign.py --can-sign
          exit 0

      - name: Launch smoke test 30 times
        shell: pwsh
        run: |
          if ($env:KQ_VARIANT -eq 'nomutex') { $env:KQ_DEBUG_NO_RUNNING_MUTEX = '1' }
          if ($env:KQ_VARIANT -eq 'notimeout') { $env:KQ_DEBUG_NO_HANDLER_TIMEOUT = '1' }
          $fails = 0
          for ($i = 1; $i -le 30; $i++) {
            $out = python -m pytest -q -rf tests/test_launch_smoke.py 2>&1 | Out-String
            if ($LASTEXITCODE -ne 0) { $fails++; if ($fails -le 3) { Write-Host "=== run $i FAILED ==="; Write-Host $out } }
          }
          Write-Host "SMOKE FAILURES: $fails of 30 ($env:KQ_VARIANT)"
          if ($fails) { exit 1 }
